# H1 cause analysis 2026-10-08: v4 ablation, see roadmap checklist
brain:
  source: minifly_v4.npz
safety:
  max_yaw: 1.0
decoder:
  axes:
    yaw:
      gain: 0.025
      terms:
        DNg02_R: 1.0
        DNg02_L: -1.0
        DNp03_L: 0.8
        DNp03_R: -0.8
  escape:
    mode: saccade
  ecps:
    brake_decay: 0.97
    saccade:
      enabled: true
      terms:
      - DNp03_L
      - DNp03_R
      threshold_hz: 15
      duration_s: 1.5
      yaw: 1.0
      backoff: 0.0
      backoff_s: 0.0
      on_brake: 0.6
      refractory_s: 1.0
      keep_direction_s: 5.0
    caution:
      hold_s: 2.0
      ramp_s: 2.0
      on_brake: 0.6
    retreat:
      enabled: false
      terms:
      - MDN_L
      - MDN_R
      threshold_hz: 20
      speed: 0.5
      min_s: 1.5
      hold_s: 1.0
      max_s: 2.0
      then_saccade: true
    throttle_per_forward: 0.14
    throttle_yaw_decouple: 0.011
ecps_drone:
  yaw_rate_max_dps: 60
outputs:
  DNg02_L:
    types:
    - ^DNg02
    side: L
  DNg02_R:
    types:
    - ^DNg02
    side: R
  DNp03_L:
    types:
    - ^DNp03$
    side: L
  DNp03_R:
    types:
    - ^DNp03$
    side: R
  DNp01_L:
    types:
    - ^DNp01$
    - ^GF$
    side: L
  DNp01_R:
    types:
    - ^DNp01$
    - ^GF$
    side: R
  MDN_L:
    types:
    - ^MDN$
    side: L
    note: moonwalker DNs, backward walking (Bidaye et al. 2014)
  MDN_R:
    types:
    - ^MDN$
    side: R
    note: moonwalker DNs, backward walking (Bidaye et al. 2014)
inputs:
  LCb_L:
    types:
    - ^LCb$
    side: L
    feature: blank
    eye: L
    max_hz: 150
  LCb_R:
    types:
    - ^LCb$
    side: R
    feature: blank
    eye: R
    max_hz: 150
  LCn_L:
    types:
    - ^LCn$
    side: L
    feature: near
    eye: L
    max_hz: 120
  LCn_R:
    types:
    - ^LCn$
    side: R
    feature: near
    eye: R
    max_hz: 120
  LCv_L:
    types:
    - ^LCv$
    side: L
    feature: ventral
    eye: L
    max_hz: 150
  LCv_R:
    types:
    - ^LCv$
    side: R
    feature: ventral
    eye: R
    max_hz: 150
vision:
  ecps_blank:
    energy_thr: 0.0002
    rows:
    - 1
    - 4
    gain: 2.5
    min_frac: 0.55
    baseline_s: 6.0
    side_gain: 2.0
  ecps_near:
    enabled: true
    rows:
    - 2
    - 6
    gain: 3.0
    min_flow: 0.08
    max_yaw_dps: 12.0
    smooth: 0.15
    outer_cols: 3
  ecps_ventral:
    enabled: true
    drop_m: 0.1
    min_rate_mps: 0.6
    window_s: 0.3
    step_hold_s: 1.0
    rise_m: 0.12
    rise_span_m: 0.15
    smooth_s: 0.4
    baseline_s: 6.0
ecps_pilot:
  height_source:
    enabled: true
    stale_s: 0.5
    land_after_s: 3.0
  height_guard:
    enabled: false
    ceiling_m: 1.0
    floor_m: 0.35
    gain: 1.5
