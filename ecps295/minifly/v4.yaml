# MiniFly v4: v3 + LCv ventral obstacle cells -> MDN (downward ToF + baro: something under the drone -> back off)
# needs --nav flow (rangefinder) and --retina ecps --pilot ecps; with GPS (no rangefinder) it behaves like v3
# run: --config minifly/v2.yaml --decoder ecps --pilot ecps --retina ecps
# offline check (blank_eval.py, 2026-10-03): plain wall -> blank 1.0 from 1.11 m; taped wall and 20' cage hover -> 0
# Fixes found by the G4 suite: climb escape impossible under the 1.0 m ceiling, escape too late, creeping into
# the wall once looming goes quiet, forward flight read as climbing, yaw read as climbing.
brain:
  source: minifly_v4.npz      # python my_minifly.py v4 --out minifly/minifly_v4.npz
safety:
  max_yaw: 1.0                 # saccades use the full range ...
decoder:
  axes:
    yaw:                       # ... so the normal read-out is halved: same 30 deg/s as before at 60 deg/s full scale
      gain: 0.025
      terms: {DNg02_R: 1.0, DNg02_L: -1.0, DNp03_L: 0.8, DNp03_R: -0.8}
  escape:
    mode: saccade              # DNp01 giant fibre still triggers, but now as a saccade
  ecps:
    brake_decay: 0.97          # ~1.1 s half-life (upstream 0.93, ~0.5 s)
    saccade:
      enabled: true
      terms: [DNp03_L, DNp03_R]
      threshold_hz: 15         # v1 missed single-tick 40 Hz bursts at 0.15 m/s (EMA 0.4 x 40 = 16)
      duration_s: 1.5          # ~90 deg at 60 deg/s
      yaw: 1.0
      backoff: 0.3
      backoff_s: 0.6
      on_brake: 0.6            # v1.1: stopped at 0.26 m, waited, then crept in once the caution ended
      refractory_s: 1.0        # v1.2: decayed brake re-triggered a saccade back toward the wall
      keep_direction_s: 5.0    # no left/right evidence -> keep turning the same way (v1.2 picked at random)
    caution:
      hold_s: 2.0
      ramp_s: 2.0
      on_brake: 0.6            # v1: a brake alone stopped it at 0.24 m, then it crept in
    retreat:                   # v4: MDN -> back up off an obstacle under the drone, then one saccade
      enabled: true
      terms: [MDN_L, MDN_R]
      threshold_hz: 20
      speed: 0.5
      min_s: 1.5                # 1.0 / 0.5: turned while still at the box edge and crossed it again
      hold_s: 1.0
      max_s: 2.0                # ~0.5 m; nothing looks backwards (S7b D1: a 4 s retreat backed into a box)
      then_saccade: true
    throttle_per_forward: 0.14 # G4 probe: forward 0.6 -> throttle -0.086
    throttle_yaw_decouple: 0.011  # G4 probe: one-sided DNg02 +17 Hz -> throttle +0.175
ecps_drone:
  yaw_rate_max_dps: 60
outputs:                       # upstream DNs (defaults.yaml) + MDN
  DNg02_L: {types: ["^DNg02"], side: L}
  DNg02_R: {types: ["^DNg02"], side: R}
  DNp03_L: {types: ["^DNp03$"], side: L}
  DNp03_R: {types: ["^DNp03$"], side: R}
  DNp01_L: {types: ["^DNp01$", "^GF$"], side: L}
  DNp01_R: {types: ["^DNp01$", "^GF$"], side: R}
  MDN_L: {types: ["^MDN$"], side: L, note: "moonwalker DNs, backward walking (Bidaye et al. 2014)"}
  MDN_R: {types: ["^MDN$"], side: R, note: "moonwalker DNs, backward walking (Bidaye et al. 2014)"}
inputs:
  LCb_L: {types: ["^LCb$"], side: L, feature: blank, eye: L, max_hz: 150}
  LCb_R: {types: ["^LCb$"], side: R, feature: blank, eye: R, max_hz: 150}
  LCn_L: {types: ["^LCn$"], side: L, feature: near, eye: L, max_hz: 120}
  LCn_R: {types: ["^LCn$"], side: R, feature: near, eye: R, max_hz: 120}
  LCv_L: {types: ["^LCv$"], side: L, feature: ventral, eye: L, max_hz: 150}
  LCv_R: {types: ["^LCv$"], side: R, feature: ventral, eye: R, max_hz: 150}
vision:
  ecps_blank:                  # EcpsRetina: sudden loss of texture in the central field
    energy_thr: 2.0e-4
    rows: [1, 4]
    gain: 2.5
    min_frac: 0.55
    baseline_s: 6.0
    side_gain: 2.0               # v2.1 (v2 = 0: both eyes saturated, side was a coin flip)
  ecps_near:                   # centering response (EcpsRetina `near`, needs --pilot ecps for the gyro)
    enabled: true
    rows: [2, 6]
    gain: 3.0
    min_flow: 0.08
    max_yaw_dps: 12.0
    smooth: 0.15                 # head-on taped wall showed +-0.4 left/right noise at 0.3
    outer_cols: 3                # lateral field only (whole eye picked up frontal edge flow)
  ecps_ventral:                # v4 LCv: ecps_ventral.VentralCue (offline on the S7d logs: 90% of box crossings,
    enabled: true              # median 0.2 s after entering, ~4 alarms away from boxes in 20 min of flight)
    drop_m: 0.10               # step: range shorter by this within window_s ...
    min_rate_mps: 0.6          # ... faster than the drone can climb or sink (vz_max 0.5); 0.8 missed slow edges
    window_s: 0.3
    step_hold_s: 1.0
    rise_m: 0.12               # rise: surface height (baro - range) above its baseline
    rise_span_m: 0.15
    smooth_s: 0.4              # against baro noise (SITL +-0.2 m)
    baseline_s: 6.0
ecps_pilot:
  height_source:               # route B height module watchdog (S7b D2)
    enabled: true
    stale_s: 0.5
    land_after_s: 3.0
  height_guard:                # EcpsPilot safety layer: baro height above the floor (ventral cue), not the flow EKF
    enabled: false             # smoke test: estimate within ~3 cm, but ArduPilot executes the descent with the corrupted
                               # EKF (still climbed over the box, then integrated a target that put it on the floor)
    ceiling_m: 1.0             # = the FENCE_MARGIN soft ceiling the EKF should have kept
    floor_m: 0.35
    gain: 1.5
