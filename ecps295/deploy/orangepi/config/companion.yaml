# ECPS295 companion hardware config (Orange Pi Zero 3W). Read by companion/ecps_companion.py --hw.
model: s7_w2map.yaml          # ecps295/minifly/<model>: final hardware config (front + rear VL53L7CX + local 3D map)

mavlink:
  url: udpin:127.0.0.1:14560  # mavlink-router endpoint "companion" (/etc/mavlink-router/main.conf)
  fc_sysid: 1
  stream_hz: 20
  rangefinder_hz: 20          # FC RANGEFINDER stream = route-B height source (twin: 10 Hz); VISO_DELAY_MS 40 on the FC
  handover_alt_m: 0.6         # control is only taken once the FC reports >= this height (pilot took off), never on the ground
                              # 2026-11-25: 0.3 -> 0.6, the flow / EKF velocity is unreliable in the first decimetres
  home_frame: true            # 2026-11-25: the pilot's x / y start at the arming point, not the EKF origin (real_drone._to_home_frame)
  ekf_origin: [33.6430, -117.8420, 20.0]  # no GPS: set while disarmed so the FC streams LOCAL_POSITION_NED (fixed, as in the sim)
  ext_height: true            # route B: VISION_POSITION_ESTIMATE z = -height above floor, 20 Hz
                              # needs EK3_SRC1_POSZ 6, VISO_TYPE 1 on the FC (config/fc_flight.parm)

guard:                        # companion-only safety layer (real_drone.py, 2026-10-16); max flight time = model safety.max_flight_s
  tof_stale_s: 0.3            # a ToF frame older than this: hover (and no hand-over)
  tof_land_s: 2.0             # still stale after this: LAND
  camera_ready_s: 0.3         # hand-over only with a camera frame younger than this
  tof_min_valid_zones: 8
  required_tof_bearings: [0, 180]
  height_monitor:               # 2026-11-21: the barometer vouches for the rangefinder (companion/height_guard.py, SITL val7)
    enabled: false              # switch on only after e has been checked on this airframe's flight logs
    fc_hz: 0.5                  # low-pass of both heights
    tau_s: 10                   # bias tracker (baro drift)
    e_m: 0.7                    # |baro - range - bias| above this ...
    t_s: 0.2                    # ... for this long = the rangefinder is not believed (0.5 until 2026-11-22; bench check open)
    rate_m: 99                  # 2 s rate criterion; 99 = off (false alarms on baro steps in SITL)
    source_set: 3               # EKF source set with baro height: needs EK3_SRC3_POSZ 1, EK3_SRC3_VELXY 5 on the FC
    land_delay_s: 0.5           # LAND this long after the switch
    oor_s: 0.3                  # 2026-11-22: range invalid this long in the air = trip (0 = off)
    skip_invalid: true          # invalid readings stay out of the low-pass (a 0.2 s blip tripped the guard without it)
    b_rate_m: 0.3               # bias moves more than this in b_window_s = slow rangefinder drift, trip (0 = off);
    b_window_s: 10              #   check the real baro drift after power-up on a bench log first (margin 1.5x in SITL)
    synth: false                # synthetic rangefinder from the baro after a trip; true needs on the FC: RNGFND2_TYPE 10,
                                #   RNGFND2_ORIENT 25, RNGFND2_MIN / MAX / GNDCLR as RNGFND1
    rng1_min: null              # RNGFND1_MIN to put back after a trip if the FC's value could not be read (synth only)

camera:
  source: uvc                 # uvc | sim | replay:<dir> | off
  device: /dev/video0
  width: 640
  height: 480
  fourcc: MJPG
  rotate: 180                 # clockwise 0/90/180/270; the real drone's camera is mounted upside down (2026-11-10)
  fps: 30
  out_w: 192                  # as gazebo/cam_bridge.py: gray, area-downsampled
  out_h: 144

tof:
  source: real                # real | sim | off
  sensors:
    front:
      bearing: 0
      bus: 0                  # TWI0 = /dev/i2c-0, header pins 3 (SDA) / 5 (SCL)
      addr: 0x29
      hz: 15
      n: 8
      hfov: 60.0
      vfov: 60.0
      max_m: 3.5
      flip_lr: false          # BENCH: tof_probe.py --orient, then set
      flip_ud: false
      transpose: false
      range_kind: radial      # BENCH: radial | perpendicular
      valid_status: [5, 9]
    rear:
      bearing: 180
      bus: 1                  # TWI1 = /dev/i2c-1, header pins 38 (SDA?) / 40 (SCL?) - verify
      addr: 0x29
      hz: 15
      n: 8
      hfov: 60.0
      vfov: 60.0
      max_m: 3.5
      flip_lr: false
      flip_ud: false
      transpose: false
      range_kind: radial
      valid_status: [5, 9]

console:                      # ground console link (companion/console_link.py, deploy/console = the Mac app); port 0 = off
  port: 14700                 # UDP on the Pi; the console connects to <pi>:14700 (telemetry) and <pi>:14550 (mavlink-router)
  handover: hold              # no autonomous patrol on hand-over before an operator selects it
  key_file: /opt/ecps295/config/console.key  # 32-byte ECL1 HMAC-SHA256 key, mode 0600
  link_timeout_s: 1.5         # no console heartbeat for this long: GOTO / MANUAL -> HOLD
  lost_land_s: 20             # still lost while holding under our control: LAND (0 = never)
  goto_timeout_s: 90
  goto_fence_margin_m: 0.4    # go-to goals must stay this far inside the geofence radius

marker:                       # ArUco target tracking (ecps295/ecps_target.py, 2026-10-18); the console's TRACK mode starts it
  enabled: true               # detector thread on; nothing flies on it until TRACK (or --track)
  dictionary: 4x4_50          # print with cv2.aruco.generateImageMarker, white border >= 1 cell
  marker_id: 7                # null = any id
  size_m: 0.15                # BENCH: printed black square side
  hfov_deg: 70.0              # BENCH: calibrate (checkerboard), or set K / dist
  pitch_deg: 12.0             # camera nose-down mount
  hz: 10                      # ~26 ms per 640x480 frame on one A55 core (2026-10-18)
  cpus: "0-5"                 # A55; the brain keeps the A76 cores

landmark:                     # 2026-10-22 position fix from fixed ArUco markers (ecps295/ecps_landmark.py); needs marker.enabled
  enabled: false              # BENCH: print the markers at marker.size_m, fix them to walls / boxes, then turn on
  ids: all                    # or a list; the tracking target (marker.marker_id) only if it stays put
  positions: {}               # surveyed {id: [north, east]} from the take-off point; others are learnt when first seen
  auto_register: true
  max_range_m: 3.0            # fixes farther than this, or more than max_bearing_deg off the nose, are not used
  max_bearing_deg: 30

gps_anchor:                   # 2026-11-23 GPS bounds the flow drift (ecps295/ecps_gps_anchor.py). The FC stays on flow + compass
  enabled: false              # (EK3_SRC1_POSXY 0): the GPS position is used here only, never in the EKF. Outdoors only.
  tau_s: 60                   # time constant of the correction (SITL: 30 s follows a poor GPS too much; 60 / 120 not resolved)
  dead_k: 1.0                 # dead band = dead_k x reported horizontal accuracy: inside it the GPS is not followed
  jump_m: 1.5                 # a GPS jump larger than this is absorbed, not followed
  hacc_max_m: 2.5             # GPS worse than this (or fix < 3D, satellites < sats_min) is ignored, the correction is held
  sats_min: 7
  rate_max_mps: 0.10
  max_m: 3.0                  # largest correction
  min_alt_m: 0.5              # the reference is taken above this height
  stream_hz: 5                # GPS_RAW_INT rate requested from the FC
