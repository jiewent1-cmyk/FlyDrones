# ECPS295 companion hardware config (Orange Pi Zero 3W). Read by companion/ecps_companion.py --hw.
model: s7_w2map.yaml          # ecps295/minifly/<model>: final hardware config (front + rear VL53L7CX + local 3D map)

mavlink:
  url: udpin:127.0.0.1:14560  # mavlink-router endpoint "companion" (/etc/mavlink-router/main.conf)
  fc_sysid: 1
  stream_hz: 20
  rangefinder_hz: 20          # FC RANGEFINDER stream = route-B height source (twin: 10 Hz); VISO_DELAY_MS 40 on the FC
  handover_alt_m: 0.3         # control is only taken once the FC reports >= this height (pilot took off), never on the ground
  ekf_origin: [33.6430, -117.8420, 20.0]  # no GPS: set while disarmed so the FC streams LOCAL_POSITION_NED (fixed, as in the sim)
  ext_height: true            # route B: VISION_POSITION_ESTIMATE z = -height above floor, 20 Hz
                              # needs EK3_SRC1_POSZ 6, VISO_TYPE 1 on the FC (sitl/variants/G_extnav_height.parm)

guard:                        # companion-only safety layer (real_drone.py, 2026-10-16); max flight time = model safety.max_flight_s
  tof_stale_s: 0.3            # a ToF frame older than this: hover (and no hand-over)
  tof_land_s: 2.0             # still stale after this: LAND
  camera_ready_s: 0.3         # hand-over only with a camera frame younger than this

camera:
  source: uvc                 # uvc | sim | replay:<dir> | off
  device: /dev/video0
  width: 640
  height: 480
  fourcc: MJPG
  fps: 30
  out_w: 192                  # as gazebo/cam_bridge.py: gray, area-downsampled
  out_h: 144

tof:
  source: real                # real | sim | off
  sensors:
    front:
      bearing: 0
      bus: 0                  # TWI0 = /dev/i2c-0, header pins 3 (SDA) / 5 (SCL)
      addr: 0x29
      hz: 15
      n: 8
      hfov: 60.0
      vfov: 60.0
      max_m: 3.5
      flip_lr: false          # BENCH: tof_probe.py --orient, then set
      flip_ud: false
      transpose: false
      range_kind: radial      # BENCH: radial | perpendicular
      valid_status: [5, 9]
    rear:
      bearing: 180
      bus: 1                  # TWI1 = /dev/i2c-1, header pins 38 (SDA?) / 40 (SCL?) - verify
      addr: 0x29
      hz: 15
      n: 8
      hfov: 60.0
      vfov: 60.0
      max_m: 3.5
      flip_lr: false
      flip_ud: false
      transpose: false
      range_kind: radial
      valid_status: [5, 9]

console:                      # ground console link (companion/console_link.py, deploy/console = the Mac app); port 0 = off
  port: 14700                 # UDP on the Pi; the console connects to <pi>:14700 (telemetry) and <pi>:14550 (mavlink-router)
  handover: patrol            # mode at hand-over until a console chooses (patrol = as without a console; the app sends hold)
  link_timeout_s: 1.5         # no console heartbeat for this long: GOTO / MANUAL -> HOLD
  lost_land_s: 20             # still lost while holding under our control: LAND (0 = never)
  goto_timeout_s: 90
  goto_fence_margin_m: 0.4    # go-to goals must stay this far inside the geofence radius

marker:                       # ArUco target tracking (ecps295/ecps_target.py, 2026-10-18); the console's TRACK mode starts it
  enabled: true               # detector thread on; nothing flies on it until TRACK (or --track)
  dictionary: 4x4_50          # print with cv2.aruco.generateImageMarker, white border >= 1 cell
  marker_id: 7                # null = any id
  size_m: 0.15                # BENCH: printed black square side
  hfov_deg: 70.0              # BENCH: calibrate (checkerboard), or set K / dist
  pitch_deg: 12.0             # camera nose-down mount
  hz: 10                      # ~26 ms per 640x480 frame on one A55 core (2026-10-18)
  cpus: "0-5"                 # A55; the brain keeps the A76 cores
