# /etc/mavlink-router/main.conf (ECPS295 Orange Pi). FC: Matek F405-WMO UART3 = SERIAL2, MAVLink2.
# Wiring (course): FC TX3 -> Pi pin 10 (PB10, UART0 RX), FC RX3 -> Pi pin 8 (PB9, UART0 TX), GND -> pin 6.
# SERIAL2_BAUD must match Baud below: 115 (115200) recommended for UART3 (no DMA); the course default is 460800/57600.
[General]
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = ardupilotmega

[UartEndpoint fc]
Device = /dev/ttyS0
Baud = 115200

# ecps_companion.py (pymavlink udpin:127.0.0.1:14560)
[UdpEndpoint companion]
Mode = Normal
Address = 127.0.0.1
Port = 14560

# ground station on Wi-Fi: Mission Planner / QGC connect UDP to <pi-ip>:14550 (or TCP <pi-ip>:5760)
[UdpEndpoint gcs]
Mode = Server
Address = 0.0.0.0
Port = 14550
