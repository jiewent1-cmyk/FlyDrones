# /etc/mavlink-router/main.conf (ECPS295 Orange Pi). FC: Matek F405-WMO UART3 = SERIAL2, MAVLink2.
# Wiring: FC TX3 -> Pi pin 13 (PB1, UART2 RX), FC RX3 -> Pi pin 11 (PB0, UART2 TX), GND -> pin 6 (overlay uart2).
# Not pins 8/10 (UART0): that is U-Boot's console, and the FC's stream stops autoboot (Pi never boots, 2026-10-31).
# SERIAL2_BAUD must match Baud below: 115 (115200) recommended for UART3 (no DMA); the course default is 460800/57600.
[General]
TcpServerPort = 0
ReportStats = false
MavlinkDialect = ardupilotmega

[UartEndpoint fc]
Device = /dev/ttyS2
Baud = 115200

# ecps_companion.py (pymavlink udpin:127.0.0.1:14560)
[UdpEndpoint companion]
Mode = Normal
Address = 127.0.0.1
Port = 14560

# Fixed console Mac address. install_pi.sh requires ECPS_GCS_IP and substitutes it before installing.
[UdpEndpoint gcs]
Mode = Normal
Address = ECPS_GCS_IP_REQUIRED
Port = 14550
